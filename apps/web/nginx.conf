server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: all client-side routes resolve to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache assets aggressively; Vite hashes filenames.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # No cache on the entry doc so the app picks up new hashed bundle names.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
