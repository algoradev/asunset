# TLS overlay — terminates HTTPS at a Caddy reverse proxy and flips
# Keycloak to production mode. Usage:
#
#   docker compose -f compose.yml -f compose.tls.yml build web keycloak-init
#   docker compose -f compose.yml -f compose.tls.yml up -d
#
# Prerequisite: /etc/hosts entries pointing the three TLS hostnames at
# 127.0.0.1 (for local dev) or at the Caddy container's public IP (for
# real deployments). See README.md "TLS mode".

volumes:
  caddy-data:
  caddy-config:

services:

  # TLS modes face real networks — same posture as the tailscale
  # overlay: the data plane must not publish. Without these resets the
  # base file leaves Postgres (5432) and OpenFGA (8081/8083) on 0.0.0.0
  # on an internet-facing box. Operator debugging: compose.cohost.yml
  # adds opt-in loopback bindings.
  postgres:
    ports: !reset []

  openfga:
    ports: !reset []

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TLS_WEB_HOST: ${TLS_WEB_HOST}
      TLS_AUTH_HOST: ${TLS_AUTH_HOST}
      TLS_API_HOST: ${TLS_API_HOST}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - keycloak
      - api
    networks: [asunset]

  # Keycloak in production mode — strict hostname, proxy-aware, SSL required.
  # Runtime auto-build detects env changes and rebuilds on first start.
  keycloak:
    command: ["start", "--import-realm"]
    environment:
      KC_HOSTNAME: https://${TLS_AUTH_HOST}
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # sslRequired=all in prod — the realm-export.json already sets
      # sslRequired=external, but this env overrides at runtime.
      KC_HOSTNAME_ADMIN: https://${TLS_AUTH_HOST}
    # Strip direct port mapping — Caddy is the only way in.
    ports: !reset []

  api:
    environment:
      KEYCLOAK_ISSUER: https://${TLS_AUTH_HOST}/realms/${KEYCLOAK_REALM}
      API_CORS_ORIGINS: https://${TLS_WEB_HOST}
    ports: !reset []

  web:
    build:
      args:
        VITE_API_URL: https://${TLS_API_HOST}
        VITE_KEYCLOAK_URL: https://${TLS_AUTH_HOST}
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM}
        VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_WEB_CLIENT_ID}
    environment:
      # Per-service hostnames: CSP must allow the auth + api origins.
      CSP_EXTRA_ORIGINS: https://${TLS_AUTH_HOST} https://${TLS_API_HOST}
    ports: !reset []

  # The script (mounted in the base) reads WEB_BASE_URL and rewrites
  # asunset-web URIs + locks sslRequired=all when the value starts with
  # https://. No command override here — base owns the script body.
  keycloak-init:
    environment:
      WEB_BASE_URL: https://${TLS_WEB_HOST}
      # Authoritative TLS host. init.sh derives WEB_BASE_URL from this
      # if the line above fails to thread, and fails loud rather than
      # ship localhost (or a bare "https://") redirect URIs on a TLS
      # deploy — same belt-and-suspenders as the tailscale overlay.
      TLS_WEB_HOST: ${TLS_WEB_HOST}
