<!doctype html>
<html lang="es">
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.5; color: #1a1a1a; max-width: 560px; margin: 0 auto; padding: 32px 16px;">
    <h1 style="font-size: 20px; margin: 0 0 16px;">Te has unido a {{ org_name }}.</h1>
    <p>
      {{ inviter_name }} te añadió a <strong>{{ org_name }}</strong>
      con el rol de <strong>{{ role }}</strong>.
    </p>
    <p>
      <a href="{{ app_url }}" style="display: inline-block; background: #1a1a1a; color: #fff; padding: 10px 16px; border-radius: 6px; text-decoration: none;">Abrir la aplicación</a>
    </p>
    <p style="color: #666; font-size: 13px; margin-top: 32px;">
      Puedes salir de la organización en cualquier momento desde la
      configuración de tu cuenta.
    </p>
  </body>
</html>
