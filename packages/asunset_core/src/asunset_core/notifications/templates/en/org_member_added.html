<!doctype html>
<html lang="en">
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.5; color: #1a1a1a; max-width: 560px; margin: 0 auto; padding: 32px 16px;">
    <h1 style="font-size: 20px; margin: 0 0 16px;">You've joined {{ org_name }}.</h1>
    <p>
      {{ inviter_name }} added you to <strong>{{ org_name }}</strong>
      as <strong>{{ role }}</strong>.
    </p>
    <p>
      <a href="{{ app_url }}" style="display: inline-block; background: #1a1a1a; color: #fff; padding: 10px 16px; border-radius: 6px; text-decoration: none;">Open the app</a>
    </p>
    <p style="color: #666; font-size: 13px; margin-top: 32px;">
      You can leave the organization at any time from your account
      settings.
    </p>
  </body>
</html>
