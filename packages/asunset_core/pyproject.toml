[project]
name = "asunset-core"
version = "0.1.0"
description = "Reusable platform primitives for asunset-based products — JWT validation, OpenFGA authorizer, audit sink, RLS-scoped DB sessions, correlation middleware."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# These are the dependencies that are genuinely needed by the core
# library — kept narrow so consumer products can drop in without
# pulling in the demo Notes app's extras.
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "openfga-sdk>=0.9",
  "structlog>=24.4",
  "jinja2>=3.1",
  "pyyaml>=6.0",
]


[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "jsonschema>=4.21",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asunset_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
