# yaml-language-server: $schema=vendor/asunset/packages/asunset_core/src/asunset_core/features/features.schema.json
# Feature manifest — versioned source of truth for what features exist
# in YOUR product (docs/feature-permissions-spec.md in vendor/asunset).
#
# Wire-up:
#   1. fga_model.py: build_model([*FEATURE_PLATFORM_TYPES, YOUR_TYPES])
#   2. Settings: features_manifest = "features.yaml"
#   3. Reconcile at startup + after bootstrap (see asunset_api.features_boot)
#   4. Gate endpoints: dependencies=[Depends(require_feature("reports.export"))]
#   5. Frontend: useFeatures() hook / GET /platform/me/features
#
# Grants are DEFAULTS (usersets only): organization#member,
# organization#admin, or role:<name>#assignee. Direct user grants and
# per-team grants are runtime tuple writes, never manifest entries.
# Do NOT mint product realm roles for feature gating — superseded.
features:
  reports.export:
    description: "Export reports to CSV/PDF"
    grants:
      - organization#member

# Capability model (spec §11) — when a feature grows real modes/tiers:
#   areas:
#     reports.export:
#       modes: [basic, org_wide]      # closed vocabulary; 3rd key segment must be one of these
#   features:
#     reports.export.org_wide:
#       grants: [role:analysts#assignee]
#       scope:                        # declared reach: a REGISTERED resolver name, never logic
#         - resource_type: report
#           resolver: org_reports
# Register resolvers at startup (authz/scopes.py-style; see the demo's
# asunset_api/authz_scopes.py); generate the matrix + test skeletons:
#   python -m asunset_core.features.matrix features.yaml --md docs/access-matrix.md --skeletons tests/feature_matrix/
