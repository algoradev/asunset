[alembic]
script_location = alembic
prepend_sys_path = src

# Two version trees share the same Alembic graph: asunset's platform
# migrations and your product's resource migrations. Alembic will walk
# the DAG across both and apply everything in revision order.
version_locations = %(script_location)s/versions ../../vendor/asunset/apps/api/alembic/versions

file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# `space` (not `os`) is required when version_locations holds two
# space-separated paths. `os` resolves to `:` on Linux / `;` on Windows
# — alembic then parses the line as one nonsense path containing a
# literal space, finds zero migrations, and silently exits 0. Don't
# change this without verifying `alembic heads` is non-empty after.
version_path_separator = space

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
