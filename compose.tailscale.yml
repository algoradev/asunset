# Tailscale mode — single-hostname, path-based routing through Caddy,
# with Tailscale serve terminating TLS externally. Usage:
#
#   ./tools/deploy/asunset-deploy             # pick "tailscale" mode
#   docker compose -f compose.yml -f compose.tailscale.yml build web keycloak-init
#   docker compose -f compose.yml -f compose.tailscale.yml up -d
#   sudo tailscale serve --bg --https=443 localhost:5173
#
# Architecture:
#   Client (tailnet) ──HTTPS:443──> tailscale serve ──HTTP:5173──> Caddy
#                                                                   │
#                                           /auth/*  ─────────────> Keycloak :8080
#                                           /api/*   ─────────────> FastAPI :8000
#                                           /*       ─────────────> web (SPA) :80

volumes:
  caddy-data:

services:

  # Tailscale mode's posture is "nothing publishes except Caddy on
  # loopback" — that must include the data plane. Without these resets
  # the base file's bindings leave Postgres (5432) and OpenFGA (8081
  # HTTP API, 8083 metrics) listening on 0.0.0.0 on every tailnet
  # deploy; on hosts without an external firewall that is an exposure,
  # and on shared hosts a guaranteed port collision. Containers reach
  # both over the compose network; operators debug via `docker exec`
  # or the compose.cohost.yml opt-in loopback publishing.
  postgres:
    ports: !reset []

  openfga:
    ports: !reset []

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      # :5173 on the host is Tailscale serve's upstream target. Not
      # exposed beyond the host — tailnet traffic reaches it only via
      # `tailscale serve`.
      - "127.0.0.1:5173:5173"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - web
      - keycloak
      - api
    networks: [asunset]

  # Keycloak in production mode with a relative base path. Every KC
  # URL now lives under /auth, which matches Caddy's handle /auth/*.
  keycloak:
    command: ["start", "--import-realm", "--http-relative-path=/auth"]
    environment:
      KC_HOSTNAME: https://${TAILSCALE_HOST}/auth
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_ADMIN: https://${TAILSCALE_HOST}/auth
    ports: !reset []

  api:
    environment:
      KEYCLOAK_ISSUER: https://${TAILSCALE_HOST}/auth/realms/${KEYCLOAK_REALM}
      # KEYCLOAK_INTERNAL_ISSUER inherits from the base compose.yml:
      #   ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}
      # The wizard writes KEYCLOAK_INTERNAL_URL=http://keycloak:8080/auth
      # for tailnet mode (vs bare for plain/TLS), so the resolved issuer
      # already includes the /auth prefix without an override here. This
      # is the same env var the consumer's compose.product.yml reads, so
      # both demo and consumer paths agree.
      API_CORS_ORIGINS: https://${TAILSCALE_HOST}
    ports: !reset []

  web:
    build:
      args:
        VITE_API_URL: https://${TAILSCALE_HOST}/api
        VITE_KEYCLOAK_URL: https://${TAILSCALE_HOST}/auth
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM}
        VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_WEB_CLIENT_ID}
    environment:
      # Single hostname: Keycloak/API are same-origin, CSP needs no extras.
      CSP_EXTRA_ORIGINS: ""
    ports: !reset []

  # The script (mounted in the base) reads KC_AUTH_URL + WEB_BASE_URL.
  # Tailnet mode runs Keycloak under /auth (--http-relative-path), so
  # kcadm needs the same suffix. WEB_BASE_URL flips asunset-web URIs and,
  # because it's https://, also locks realm sslRequired=all. No command
  # override — overlays must NOT redefine `command:` (compose merges it
  # as REPLACE, dropping the base's manage-users + SMTP blocks).
  keycloak-init:
    environment:
      KC_AUTH_URL: http://keycloak:8080/auth
      WEB_BASE_URL: https://${TAILSCALE_HOST}
      # Authoritative tailnet host. init.sh derives WEB_BASE_URL from this
      # if the line above ever fails to thread through, and uses it to
      # fail loud rather than ship localhost redirect URIs on a tailnet
      # deploy. Belt-and-suspenders against the redirect_uri landmine.
      TAILSCALE_HOST: ${TAILSCALE_HOST}
